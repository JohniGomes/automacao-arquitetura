# Blueprint do Render — PLANO GRÁTIS (demo). Sem disco: usuários, créditos e arquivos se perdem a cada reinício/deploy,
# e o serviço dorme após inatividade. Para produção use render.paid.yaml (plano pago + disco persistente).
services:
  - type: web
    name: arqia
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: MOCK_MODE
        value: auto   # sem GEMINI_API_KEY/GOOGLE_MAPS_API_KEY roda em mock
      - key: SIGNUP_CREDITS
        value: "15"   # cadastro é aberto: cada conta nova pode gastar API real se houver chave
      - key: CLIP_SECONDS
        value: "5"   # teto de cada clipe do filme (o excedente é cortado)
      - key: GEMINI_IMAGE_MODEL
        value: gemini-nano-banana-2.1
      - key: GEMINI_VIDEO_MODEL
        value: gemini-omni-1.1-flash
      - key: GEMINI_IMAGE_SIZE
        value: 1K
      - key: APP_URL
        sync: false   # https://SEU-APP.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
